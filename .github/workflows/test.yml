# Test CI
# 
# 自动运行单元测试、Widget 测试和 Integration 测试

name: Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run unit tests
        run: |
          flutter test test/ \
            --coverage \
            --reporter expanded \
            --no-pub 2>&1 | tee unit-tests.log

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Check coverage thresholds
        run: |
          python3 scripts/quality_gate.py coverage coverage/lcov.info --threshold 70

      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            unit-tests.log
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  widget-tests:
    name: Widget Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run widget tests
        run: |
          flutter test test/widget/ \
            --reporter expanded \
            --no-pub 2>&1 | tee widget-tests.log

      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: widget-test-results
          path: |
            widget-tests.log
          if-no-files-found: warn
          retention-days: 14

  integration-tests:
    name: Integration Tests
    runs-on: macos-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare synthetic Firebase resources
        run: python3 scripts/prepare_ci_firebase.py

      - name: Run iOS Simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/ios-simulators.json"
          IOS_SIMULATOR_ID=$(python3 scripts/select_ios_simulator.py < "$RUNNER_TEMP/ios-simulators.json")
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
          echo "IOS_SIMULATOR_ID=$IOS_SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Run integration tests (iOS)
        run: |
          flutter test integration_test/ \
            --device-id "$IOS_SIMULATOR_ID" \
            --reporter expanded \
            --no-pub 2>&1 | tee ios-integration.log

      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-integration-results
          path: |
            ios-integration.log
          if-no-files-found: warn
          retention-days: 14

  integration-tests-android:
    name: Integration Tests (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare synthetic Firebase resources
        run: python3 scripts/prepare_ci_firebase.py

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          script: bash -o pipefail -c "flutter test integration_test/ --no-pub --reporter expanded 2>&1 | tee android-integration.log"

      - name: Preserve test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-integration-results
          path: |
            android-integration.log
          if-no-files-found: warn
          retention-days: 14

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 5
    needs: [unit-tests, widget-tests, integration-tests, integration-tests-android]
    steps:
      - name: Generate summary
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          WIDGET_RESULT: ${{ needs.widget-tests.result }}
          IOS_RESULT: ${{ needs.integration-tests.result }}
          ANDROID_RESULT: ${{ needs.integration-tests-android.result }}
        run: |
          {
            echo "## Test Results"
            echo ""
            echo "| Job | Result |"
            echo "|-----|--------|"
            printf '| Unit tests and coverage gate | %s |\n' "$UNIT_RESULT"
            printf '| Widget tests | %s |\n' "$WIDGET_RESULT"
            printf '| iOS integration | %s |\n' "$IOS_RESULT"
            printf '| Android integration | %s |\n' "$ANDROID_RESULT"
            echo ""
            echo "See job logs and uploaded artifacts for test counts and measured coverage."
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$UNIT_RESULT" "$WIDGET_RESULT" "$IOS_RESULT" "$ANDROID_RESULT"; do
            if [[ "$result" != "success" ]]; then
              exit 1
            fi
          done
