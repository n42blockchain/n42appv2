# N42Wallet CI/CD 流水线
# 
# 触发条件：
# - 推送到 main/develop 分支
# - 创建 Pull Request 到 main 分支
# - 手动触发

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 取消正在运行的重复工作流
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.27.0'
  JAVA_VERSION: '21'

jobs:
  # ==================== 代码分析 ====================
  analyze:
    name: 代码分析
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 代码格式检查
        run: dart format --set-exit-if-changed .

      - name: 静态分析
        run: flutter analyze --fatal-infos

      - name: 检查依赖更新
        run: flutter pub outdated

  # ==================== 单元测试 ====================
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 运行测试（含覆盖率）
        run: flutter test --coverage --reporter=github

      - name: 检查测试覆盖率
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 50  # 最低覆盖率要求

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==================== 构建 Android ====================
  build-android:
    name: 构建 Android
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get

      # 配置签名（如果有密钥）
      - name: 配置签名密钥
        if: ${{ env.ANDROID_KEYSTORE != '' }}
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > android/app/keystore.jks
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: 构建 APK
        run: flutter build apk --release --split-per-abi

      - name: 构建 App Bundle
        run: flutter build appbundle --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

      - name: 上传 App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/*.aab
          retention-days: 7

  # ==================== 构建 iOS ====================
  build-ios:
    name: 构建 iOS
    runs-on: macos-latest
    needs: [analyze, test]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 安装 CocoaPods 依赖
        run: |
          cd ios
          pod install --repo-update

      - name: 构建 iOS (无签名)
        run: flutter build ios --release --no-codesign

      - name: 上传 iOS 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: build/ios/iphoneos/
          retention-days: 7

  # ==================== 发布到 Firebase App Distribution ====================
  deploy-firebase:
    name: 发布到 Firebase
    runs-on: ubuntu-latest
    needs: [build-android]
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载 APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: build/

      - name: 发布到 Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app-arm64-v8a-release.apk

