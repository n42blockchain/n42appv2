# CI Pipeline - Complete Flutter CI/CD
#
# 完整的 Flutter CI 流水线，包括：
# - 代码分析 (flutter analyze)
# - 单元测试 (flutter test)
# - 覆盖率门禁
# - 安全扫描
# - 性能回归检测

name: CI Pipeline

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
  workflow_call:

env:
  # Match pubspec.yaml: Flutter 3.47.5 ships Dart 3.13.4.
  # Java 21 matches android/app/build.gradle.kts compileOptions.
  FLUTTER_VERSION: '3.47.5'
  COVERAGE_THRESHOLD: 70
  JAVA_VERSION: '21'

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # 代码分析
  # ============================================
  analyze:
    name: 📊 Code Analysis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Resolve and analyze the standalone JMT verifier
        working-directory: packages/n42_jmt_verify
        run: |
          dart pub get
          dart analyze

      - name: Check wallet and chat localization integrity
        run: |
          python3 scripts/audit_localizations.py --mode all
          python3 -m unittest discover -s test/scripts

      - name: Run Flutter Analyze
        run: |
          flutter analyze --no-fatal-infos 2>&1 | tee analyze_output.txt
          
          # 统计问题数量
          ERRORS=$(grep -c "error •" analyze_output.txt || true)
          WARNINGS=$(grep -c "warning •" analyze_output.txt || true)
          INFOS=$(grep -c "info •" analyze_output.txt || true)
          
          echo "## 📊 Code Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Type | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Errors | $ERRORS |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚠️ Warnings | $WARNINGS |" >> $GITHUB_STEP_SUMMARY
          echo "| ℹ️ Infos | $INFOS |" >> $GITHUB_STEP_SUMMARY
          
          # 如果有错误则失败
          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::Found $ERRORS analysis errors"
            exit 1
          fi

      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed lib/ test/ || {
            echo "::error::Code formatting issues found. Run 'dart format lib/ test/' to fix."
            exit 1
          }

      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: analysis-results
          path: analyze_output.txt
          retention-days: 7

  # ============================================
  # 单元测试与覆盖率
  # ============================================
  test:
    name: 🧪 Tests & Coverage
    runs-on: ubuntu-latest
    needs: analyze
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        id: dependencies
        run: |
          flutter pub get --enforce-lockfile
          python3 - <<'PY_OVERRIDES'
          import json, pathlib
          from urllib.parse import urljoin, urlparse, unquote
          config = pathlib.Path('.dart_tool/package_config.json').resolve()
          packages = {p['name']: p for p in json.loads(config.read_text())['packages']}
          for name in ['audioplayers_darwin', 'webview_flutter_wkwebview', 'flutter_mining']:
              actual = pathlib.Path(unquote(urlparse(urljoin(config.as_uri(), packages[name]['rootUri'])).path)).resolve()
              expected = pathlib.Path('plugins/flutter_mining' if name == 'flutter_mining' else f'packages/{name}').resolve()
              assert actual == expected, (name, actual, expected)
              print(f'{name}: {actual}')
          PY_OVERRIDES

      - name: Resolve and test the standalone JMT verifier
        working-directory: packages/n42_jmt_verify
        run: |
          dart pub get
          dart test

      - name: Test active local plugins
        run: |
          flutter test plugins/flutter_mining/test/
          (cd plugins/flutter_mining/example && flutter pub get && flutter test test/)
          flutter test packages/webview_flutter_wkwebview/test/

      - name: Run tests with coverage
        id: root_tests
        run: |
          ulimit -n 4096
          flutter test test/ --coverage --concurrency=4 --machine > test_results.jsonl
          python3 scripts/quality_gate.py tests test_results.jsonl | tee test_output.txt
          cat test_output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Export the resolved Chat Git revision
        id: chat_export
        if: ${{ always() && steps.dependencies.outcome == 'success' }}
        run: |
          python3 - <<'PY_CHAT'
          import io, json, os, pathlib, re, subprocess, tarfile, tempfile
          config_path = pathlib.Path('.dart_tool/package_config.json').resolve()
          config = json.loads(config_path.read_text())
          chat = next(p for p in config['packages'] if p['name'] == 'n42_chat')
          from urllib.parse import urljoin, urlparse, unquote
          source = pathlib.Path(unquote(urlparse(urljoin(config_path.as_uri(), chat['rootUri'])).path))
          lock = pathlib.Path('pubspec.lock').read_text()
          block = re.search(r'^  n42_chat:\n(.*?)(?=^  \w+:)', lock, re.M | re.S).group(1)
          assert re.search(r'^    source: git$', block, re.M), 'Chat must resolve from Git'
          revision = re.search(r'resolved-ref: ["\']?([0-9a-f]{40})', block).group(1)
          declared = re.search(r'ref: ([0-9a-f]{40})', pathlib.Path('pubspec.yaml').read_text()).group(1)
          assert revision == declared, (revision, declared)
          checkout = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
          assert checkout == revision, (checkout, revision)
          target = pathlib.Path(tempfile.mkdtemp(prefix='n42-chat-', dir=os.environ['RUNNER_TEMP']))
          archive = subprocess.check_output(['git', '-C', str(source), 'archive', revision])
          with tarfile.open(fileobj=io.BytesIO(archive)) as files:
              files.extractall(target, filter='data')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'CHAT_TEST_ROOT={target}\n')
          print(f'Chat checks use Git {revision} exported to {target}')
          PY_CHAT

      - name: Resolve the Chat package dependencies
        id: chat_dependencies
        if: ${{ always() && steps.chat_export.outcome == 'success' }}
        run: |
          cd "$CHAT_TEST_ROOT"
          flutter pub get

      - name: Analyze the resolved Chat package
        if: ${{ always() && steps.chat_dependencies.outcome == 'success' }}
        run: |
          cd "$CHAT_TEST_ROOT"
          flutter analyze --no-fatal-infos

      - name: Test the resolved Chat package
        if: ${{ always() && steps.chat_dependencies.outcome == 'success' }}
        run: |
          cd "$CHAT_TEST_ROOT"
          ulimit -n 4096
          flutter test test/ --concurrency=4

      - name: Generate coverage report
        if: ${{ always() && steps.root_tests.outcome == 'success' }}
        run: |
          # 安装 lcov
          sudo apt-get update
          sudo apt-get install -y lcov
          
          # 生成 HTML 报告
          genhtml coverage/lcov.info -o coverage/html
          
          python3 scripts/quality_gate.py coverage coverage/lcov.info \
            --threshold "${{ env.COVERAGE_THRESHOLD }}" | tee coverage_summary.json
          cat coverage_summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test_output.txt
            test_results.jsonl
          retention-days: 7

  # ============================================
  # 安全扫描
  # ============================================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: analyze
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check for outdated dependencies
        run: |
          flutter pub outdated 2>&1 | tee outdated_output.txt
          
          echo "## 📦 Dependency Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -50 outdated_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Security audit - Check for known vulnerabilities
        run: |
          echo "## 🔒 Security Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Advisory source heuristics only; these are not proof of a security audit.
          echo "### Sensitive Data Check" >> $GITHUB_STEP_SUMMARY
          
          # 检查硬编码的密钥
          HARDCODED_KEYS=$(grep -r -n "api_key\|apiKey\|API_KEY\|secret\|SECRET\|password\|PASSWORD" lib/ --include="*.dart" | grep -v "test" | grep -v "mock" | grep -v "//" | wc -l || true)
          
          if [ "$HARDCODED_KEYS" -gt 0 ]; then
            echo "⚠️ Found $HARDCODED_KEYS potential hardcoded secrets" >> $GITHUB_STEP_SUMMARY
          else
            echo "No matches in this heuristic; credential review is still required" >> $GITHUB_STEP_SUMMARY
          fi
          
          # 检查 HTTP 使用
          HTTP_USAGE=$(grep -r -n "http://" lib/ --include="*.dart" | grep -v "https://" | grep -v "localhost" | grep -v "127.0.0.1" | wc -l || true)
          
          if [ "$HTTP_USAGE" -gt 0 ]; then
            echo "⚠️ Found $HTTP_USAGE insecure HTTP URLs" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No insecure HTTP URLs detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          # 检查 SSL 证书绕过
          SSL_BYPASS=$(grep -r -n "badCertificateCallback.*true" lib/ --include="*.dart" | wc -l || true)
          
          if [ "$SSL_BYPASS" -gt 0 ]; then
            echo "⚠️ Found $SSL_BYPASS SSL certificate bypasses" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No SSL bypasses in production code" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Dependency license check
        run: |
          echo "### License Compliance" >> $GITHUB_STEP_SUMMARY
          
          # 检查 pubspec.yaml 中的依赖
          DEPS_COUNT=$(grep -c ":" pubspec.yaml || true)
          echo "- Total dependencies: $DEPS_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- License check: Manual review recommended" >> $GITHUB_STEP_SUMMARY

      - name: SAST - Static Application Security Testing
        run: |
          echo "### Static Analysis Security" >> $GITHUB_STEP_SUMMARY
          
          # 检查潜在的注入漏洞
          POTENTIAL_INJECTION=$(grep -r -n "Process.run\|shell=true\|eval(" lib/ --include="*.dart" | wc -l || true)
          
          if [ "$POTENTIAL_INJECTION" -gt 0 ]; then
            echo "⚠️ Found $POTENTIAL_INJECTION potential injection risks" >> $GITHUB_STEP_SUMMARY
          else
            echo "No matches in this heuristic; this is not an injection-safety verdict" >> $GITHUB_STEP_SUMMARY
          fi

  backend-tests:
    name: Backend contracts
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    strategy:
      fail-fast: false
      matrix:
        module: [backend/swap, backend/social-auth, backend/loyalty, backend/livekit-jwt]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Test and vet
        working-directory: ${{ matrix.module }}
        run: |
          go test ./...
          go vet ./...

  # ============================================
  # 性能回归检测
  # ============================================
  performance:
    name: ⚡ Performance Regression
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create benchmark results directory
        run: mkdir -p benchmark_results

      - name: Run performance benchmarks
        run: |
          flutter test test/benchmark/ --reporter expanded 2>&1 | tee benchmark_output.txt
          
          echo "## ⚡ Performance Benchmarks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Analyze app size
        run: |
          echo "### 📦 App Size Analysis" >> $GITHUB_STEP_SUMMARY
          
          # 分析 Dart 代码大小
          DART_FILES=$(find lib -name "*.dart" | wc -l)
          DART_LINES=$(find lib -name "*.dart" -exec cat {} \; | wc -l)
          
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dart Files | $DART_FILES |" >> $GITHUB_STEP_SUMMARY
          echo "| Total Lines | $DART_LINES |" >> $GITHUB_STEP_SUMMARY

      - name: Check for performance anti-patterns
        run: |
          echo "### 🔍 Performance Anti-patterns" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # 检查过度使用 setState
          SETSTATE_COUNT=$(grep -r "setState(" lib/ --include="*.dart" | wc -l || true)
          echo "- setState calls: $SETSTATE_COUNT" >> $GITHUB_STEP_SUMMARY
          
          # 检查未使用 const
          NON_CONST_WIDGETS=$(grep -r "new Text\|new Container\|new Column\|new Row" lib/ --include="*.dart" | wc -l || true)
          echo "- Non-const widget instantiations: $NON_CONST_WIDGETS" >> $GITHUB_STEP_SUMMARY
          
          # 检查 ListView 使用
          LISTVIEW_BUILDER=$(grep -r "ListView.builder" lib/ --include="*.dart" | wc -l || true)
          LISTVIEW_DIRECT=$(grep -r "ListView(" lib/ --include="*.dart" | grep -v "builder" | wc -l || true)
          echo "- ListView.builder: $LISTVIEW_BUILDER (recommended)" >> $GITHUB_STEP_SUMMARY
          echo "- ListView() direct: $LISTVIEW_DIRECT (review needed)" >> $GITHUB_STEP_SUMMARY

      - name: Performance thresholds
        run: |
          echo "### 📊 Performance Thresholds" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "Native startup, navigation and memory thresholds require measured device evidence; synthetic benchmark tests do not establish them." >> $GITHUB_STEP_SUMMARY

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark_results/
            benchmark_output.txt
          retention-days: 30

  # ============================================
  # Android 构建验证
  # ============================================
  build-android:
    name: 🤖 Build Android
    runs-on: ubuntu-latest
    needs: [test, security]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (Debug)
        env:
          WALLET_CORE_USER: ${{ secrets.WALLET_CORE_USER }}
          WALLET_CORE_KEY: ${{ secrets.WALLET_CORE_KEY }}
        run: |
          flutter build apk --debug 2>&1 | tee android_build.txt
          
          # 获取 APK 大小
          APK_SIZE=$(ls -lh build/app/outputs/flutter-apk/app-debug.apk | awk '{print $5}')
          
          echo "## 🤖 Android Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| APK Size (Debug) | $APK_SIZE |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Status | ✅ Success |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # iOS 构建验证
  # ============================================
  build-ios:
    name: 🍎 Build iOS
    runs-on: macos-latest
    needs: [test, security]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          IOS_SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          test "${IOS_SDK_VERSION%%.*}" -ge 26
          flutter build ios --no-codesign --release 2>&1 | tee ios_build.txt
          
          echo "## 🍎 iOS Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Status | ✅ Success |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # CI 总结报告
  # ============================================
  summary:
    name: 📋 CI Summary
    runs-on: ubuntu-latest
    needs: [analyze, test, security, backend-tests, performance, build-android, build-ios]
    if: always()
    
    steps:
      - name: Generate CI Summary
        run: |
          echo "# 🚀 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Code Analysis | ${{ needs.analyze.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests & Coverage | ${{ needs.test.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance | ${{ needs.performance.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Android Build | ${{ needs.build-android.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS Build | ${{ needs.build-ios.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY

      - name: Check overall status
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY_CHECK'
          import json, os, sys
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          print(json.dumps(failed or {'status': 'all required jobs passed'}))
          sys.exit(bool(failed))
          PY_CHECK
