# N42Wallet 发布流水线
#
# 触发条件：
# - 创建新的 Tag (v*)

name: Release

on:
  push:
    tags:
      - 'v*'

env:
  FLUTTER_VERSION: '3.47.5'
  JAVA_VERSION: '21'

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ==================== 创建 GitHub Release ====================
  create-release:
    name: 创建 Release
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag and canonical version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/quality_gate.py version pubspec.yaml --tag "$RELEASE_TAG"
      - name: 获取版本号
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --draft --title "Release $RELEASE_TAG" --generate-notes

  # ==================== 构建并发布 Android ====================
  release-android:
    name: 发布 Android
    runs-on: ubuntu-latest
    needs: create-release
    environment: release
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: 安装依赖
        run: flutter pub get

      - name: 配置签名密钥
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > android/app/keystore.jks
          echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
          echo "storeFile=keystore.jks" >> android/key.properties

      - name: Build signed Android artifacts
        env:
          WALLET_CORE_USER: ${{ secrets.WALLET_CORE_USER }}
          WALLET_CORE_KEY: ${{ secrets.WALLET_CORE_KEY }}
          RELEASE_DART_DEFINES: ${{ secrets.RELEASE_DART_DEFINES }}
        run: |
          test -n "$RELEASE_DART_DEFINES"
          umask 077
          printf '%s' "$RELEASE_DART_DEFINES" > "$RUNNER_TEMP/release-defines.json"
          bash build_release.sh android --dart-define-from-file "$RUNNER_TEMP/release-defines.json"

      - name: Check 64-bit native library alignment
        run: python3 scripts/audit_android_native.py build/app/outputs/bundle/release/app-release.aab

      - name: Upload APK to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" build/app/outputs/flutter-apk/app-release.apk

      - name: 上传到 Google Play (内部测试)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT }}
          packageName: ai.n42.www
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: draft

      - name: Remove Android signing and runtime configuration
        if: always()
        run: rm -f android/key.properties android/app/keystore.jks "$RUNNER_TEMP/release-defines.json"

  # ==================== 构建并发布 iOS ====================
  release-ios:
    name: 发布 iOS
    runs-on: macos-latest
    needs: create-release
    environment: release
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: 安装依赖
        run: flutter pub get

      - name: 安装 CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: 安装证书和配置文件
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_EXTENSION_PROVISIONING_PROFILE: ${{ secrets.IOS_EXTENSION_PROVISIONING_PROFILE }}
        run: |
          test -n "$IOS_CERTIFICATE_P12"
          test -n "$IOS_PROVISIONING_PROFILE"
          test -n "$IOS_EXTENSION_PROVISIONING_PROFILE"
          # 创建临时 keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          umask 077
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # 导入证书
          echo "$IOS_CERTIFICATE_P12" | base64 --decode > certificate.p12
          security import certificate.p12 -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s $KEYCHAIN_PATH
          
          # 安装配置文件
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          echo "$IOS_EXTENSION_PROVISIONING_PROFILE" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/extension.mobileprovision

      - name: Build iOS archive and preserve the committed version
        env:
          RELEASE_DART_DEFINES: ${{ secrets.RELEASE_DART_DEFINES }}
        run: |
          test -n "$RELEASE_DART_DEFINES"
          umask 077
          printf '%s' "$RELEASE_DART_DEFINES" > "$RUNNER_TEMP/release-defines.json"
          bash build_release.sh ipa --dart-define-from-file "$RUNNER_TEMP/release-defines.json"

      - name: Locate exported IPA
        run: |
          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          test "${#ipas[@]}" -eq 1
          echo "IPA_PATH=${ipas[0]}" >> "$GITHUB_ENV"

      - name: Upload IPA to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" "$IPA_PATH"

      - name: Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_API_ISSUER_ID }}
        run: |
          test -n "$APP_STORE_CONNECT_API_KEY"
          test -n "$API_KEY_ID"
          test -n "$API_ISSUER"
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          xcrun altool --upload-app -f "$IPA_PATH" --type ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"

      - name: Remove iOS signing and runtime configuration
        if: always()
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_API_KEY_ID }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f certificate.p12 "$RUNNER_TEMP/release-defines.json"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/profile.mobileprovision"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/extension.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
