name: android_native_smoke
description: Isolated Android SQLCipher, Matrix, and Vodozemac acceptance harness.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_callkit_incoming: 3.1.6
  flutter_vodozemac:
    path: ../../../packages/flutter_vodozemac
  matrix: 13.0.0
  path: 1.9.1
  sqflite: 2.4.4
  sqflite_sqlcipher: 3.4.1
  sqlite3: 3.6.0
  vodozemac: 0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

hooks:
  user_defines:
    sqlite3:
      source:
        android: system
        default: sqlcipher
      name:
        android: sqlcipher
