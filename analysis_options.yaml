# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Exclude auto-generated files from analysis
  exclude:
    - "lib/generated/**"
    - "**.g.dart"
    - "**.freezed.dart"
    # Nested Flutter example/test projects with their own pubspec — should not
    # be analyzed by the host project (would error on their own imports).
    - "packages/webview_flutter_wkwebview/example/**"
    - "plugins/flutter_mining/example/**"
    # Pigeon schema files are code-generation input, not Dart source.
    - "packages/webview_flutter_wkwebview/pigeons/**"
    # n42_jmt_verify is not currently referenced by the host (verified via
    # grep over lib/) and depends on a blake3 API that pub.dev's `hashlib`
    # package no longer exposes. Keep the package on disk until we either
    # wire it up or re-home the Blake3 impl; suppress its 22 analyze errors
    # so the root analyze reflects what actually ships.
    - "packages/n42_jmt_verify/**"

  errors:
    # wallet package is a transitive dependency, suppress this warning
    depend_on_referenced_packages: ignore

linter:
  rules:
    # Disabled: Cryptocurrency symbols (BTC, ETH, etc.) follow industry conventions
    constant_identifier_names: false

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
