# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

analyzer:
  # Exclude auto-generated files from analysis
  exclude:
    - "lib/generated/**"
    - "**.g.dart"
    - "**.freezed.dart"
    # This repository directory is a local mirror only; production resolves
    # n42_chat from the Git dependency in pubspec.yaml.
    - "packages/n42_chat/**"
    # Nested Flutter example/test projects with their own pubspec — should not
    # be analyzed by the host project (would error on their own imports).
    - "packages/webview_flutter_wkwebview/example/**"
    - "plugins/flutter_mining/example/**"
    # Pigeon schema files are code-generation input, not Dart source.
    - "packages/webview_flutter_wkwebview/pigeons/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
  errors:
    # wallet package is a transitive dependency, suppress this warning
    depend_on_referenced_packages: ignore

linter:
  rules:
    # Disabled: Cryptocurrency symbols (BTC, ETH, etc.) follow industry conventions
    constant_identifier_names: false

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
