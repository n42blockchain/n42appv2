// 这是一个简单的AAR模块配置
configurations.maybeCreate("default")

// 将AAR文件作为artifact添加
artifacts.add("default", file('../libs/mobile-sdk-release.aar'))

// 可选：添加POM信息（如果需要）
afterEvaluate {
    publishing {
        publications {
            maven(MavenPublication) {
                groupId = 'com.external'
                artifactId = 'evm-sdk'
                version = '1.0.0'

                // 发布AAR文件
                artifact file('../libs/evm.aar')

                // 添加POM依赖信息（如果有依赖的话）
                pom.withXml {
                    def dependenciesNode = asNode().appendNode('dependencies')
                    // 如果有传递依赖，在这里添加
                    // 例如：
                    // def dependencyNode = dependenciesNode.appendNode('dependency')
                    // dependencyNode.appendNode('groupId', 'com.android.support')
                    // dependencyNode.appendNode('artifactId', 'appcompat-v7')
                    // dependencyNode.appendNode('version', '28.0.0')
                }
            }
        }
    }
}