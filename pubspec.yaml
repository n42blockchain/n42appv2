name: n42appv2
description: "N42 Wallet - Enterprise cryptocurrency wallet application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # === UI Components ===
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  easy_refresh: ^3.4.0
  flutter_slidable: ^3.1.2
  qr_flutter: ^4.1.0
  fl_chart: ^0.70.2
  extended_image: ^9.1.0
  custom_pop_up_menu: ^1.2.4
  gesture_password_widget: ^2.0.1
  roundcheckbox: ^2.0.5
  simple_html_css: ^5.0.0
  file_icon: ^1.0.0
  chewie: ^1.8.5

  # === Internationalization ===
  intl: ^0.20.2

  # === State Management ===
  provider: ^6.1.4

  # === Database & Storage ===
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^9.2.4

  # === Network ===
  dio: ^5.7.0
  connectivity_plus: ^6.1.5
  internet_connection_checker: ^1.0.0+1
  cached_network_image: ^3.4.1
  webview_flutter: ^4.13.0

  # === Blockchain & Crypto ===
  bitcoin_base: ^5.3.0
  eth_sig_util: ^0.0.9
  web3dart: ^2.7.3
  fast_base58: ^0.2.1
  bech32: ^0.2.2
  crypto: ^3.0.7
  decimal: ^2.3.3
  reown_walletkit: ^1.1.3

  # === Protocol Buffers ===
  protobuf: ^3.1.0

  # === Utilities ===
  validators: ^3.0.0
  event_bus: ^2.0.1
  fluttertoast: ^8.2.14
  flustars_flutter3: ^3.0.0
  date_format: ^2.0.9
  archive: ^4.0.2

  # === Media & Files ===
  image_picker: ^1.2.1
  file_picker: ^8.3.7
  video_compress: ^3.1.4
  video_player: ^2.10.1
  pro_image_editor: ^7.6.5
  open_filex: ^4.6.0
  share_plus: ^10.1.4

  # === Security & Auth ===
  local_auth: ^2.3.0
  permission_handler: ^11.4.0
  encrypt: ^5.0.3
  aes_crypt_null_safe: ^3.0.0
  flutter_face_api: ^7.2.540
  flutter_face_core_basic: ^7.2.235

  # === QR Code ===
  qr_code_scanner_plus: ^2.0.14

  # === Device Info ===
  device_info_plus: ^11.5.0
  package_info_plus: ^8.3.1

  # === Notifications ===
  flutter_local_notifications: ^19.5.0
  flutter_new_badger: ^1.1.0

  # === Deep Links ===
  app_links: ^6.4.1

  # === External Store ===
  rate_us_on_store: ^0.0.4

  # === Firebase ===
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  firebase_crashlytics: ^4.3.10
  firebase_analytics: ^11.6.0

  # === Enterprise Architecture ===
  get_it: ^7.7.0
  injectable: ^2.6.0
  go_router: ^14.8.1
  dartz: ^0.10.1
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # === Linting ===
  flutter_lints: ^5.0.0

  # === Code Generation ===
  build_runner: ^2.5.4
  json_serializable: ^6.9.5
  injectable_generator: ^2.7.0
  freezed: ^2.5.8

  # === Testing ===
  mockito: ^5.4.6
  mocktail: ^1.0.3
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/home/
    - assets/home/tabbar/
    - assets/home/setting/
    - assets/home/setting/scurity/
    - assets/home/about/
    - assets/img/
    - assets/browser/
    - assets/wallet/
    - assets/wallet/swap/
    - assets/face/
    - assets/login/
    - assets/mining/
    - assets/chat/

flutter_intl:
  enabled: true
