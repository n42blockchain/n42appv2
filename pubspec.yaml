name: n42_wallet
description: "N42 Wallet - Enterprise cryptocurrency wallet application"
publish_to: 'none'

version: 2.4.8+2026072833

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.8"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  mobile_scanner: ^7.2.0
  # === UI Components ===
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  easy_refresh: ^3.4.0
  flutter_slidable: ^4.0.3
  qr_flutter: ^4.1.0
  fl_chart: ^1.1.1
  extended_image: ^10.0.1
  custom_pop_up_menu: ^1.2.4
  gesture_password_widget: ^2.0.1
  roundcheckbox: ^2.0.5
  simple_html_css: ^5.0.0
  chewie: ^1.13.1

  # === Internationalization ===
  intl: ^0.20.2

  # === State Management ===
  flutter_riverpod: ^3.2.1
  riverpod_annotation: ^4.0.2

  # === Database & Storage ===
  sqflite: ^2.4.3
  sqflite_sqlcipher: ^3.1.0+1  # 加密数据库支持
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0

  # === Network ===
  dio: ^5.9.2
  # NewsApi 解析 RSS feed（已在 transitive 树里，这里显式声明以避免依赖飘移）
  xml: ^6.6.0
  connectivity_plus: ^7.0.0
  cached_network_image: ^3.4.1
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.13.0
  webview_flutter_wkwebview: ^3.24.0
  web_socket_channel: ^3.0.2
  http: ^1.3.0
  url_launcher: ^6.3.2
  flutter_cache_manager: ^3.4.1

  # === Blockchain & Crypto ===
  eip712: ^1.0.1  # 替换 eth_sig_util，支持 EIP-712 typed data signing
  web3dart: ^3.0.1
  web3auth_flutter: ^6.3.0
  fast_base58: ^0.2.1
  bech32: ^0.2.2
  crypto: ^3.0.7
  decimal: ^3.2.4
  pointycastle: ^4.0.0
  blockchain_utils: ^7.1.0
  reown_walletkit: ^1.4.0
  reown_sign: ^1.3.9
  reown_core: ^1.3.8

  # === Protocol Buffers ===
  protobuf: ^6.0.0
  fixnum: ^1.1.0

  # === Utilities ===
  validators: ^3.0.0
  event_bus: ^2.0.1
  fluttertoast: ^9.0.0
  flustars_flutter3: ^3.0.0
  date_format: ^2.0.9
  convert: ^3.1.2
  cryptography: ^2.7.0

  # === Media & Files ===
  image_picker: ^1.2.1
  photo_manager: ^3.12.0
  file_picker: ^11.0.2
  video_compress: ^3.1.4
  video_player: ^2.13.0
  pro_image_editor: ^13.2.3
  open_filex: ^4.6.0
  share_plus: ^12.0.1

  # === Security & Auth ===
  local_auth: ^3.0.1
  local_auth_android: ^2.0.9
  local_auth_darwin: ^2.0.3
  permission_handler: ^12.0.1
  # encrypt 包已被 pointycastle 直接实现替代
  aes_crypt_null_safe: ^3.0.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  pinput: ^6.0.2

  # === QR Code ===
  qr_code_scanner_plus: ^2.2.0

  # === Device Info ===
  device_info_plus: ^12.3.0
  package_info_plus: ^9.0.0

  # === Notifications ===
  flutter_local_notifications: ^22.2.0
  flutter_new_badger: ^2.0.0

  # === Deep Links ===
  app_links: ^7.2.1

  # === External Store ===
  rate_us_on_store: ^0.0.4
  in_app_purchase: ^3.2.0

  # === Firebase ===
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  firebase_crashlytics: ^5.0.8
  firebase_analytics: ^12.1.3

  # === Enterprise Architecture ===
  go_router: ^17.0.0
  dartz: ^0.10.1
  equatable: ^2.0.7
  freezed_annotation: ^3.1.0

  # === V1 Mining Plugin ===
  flutter_mining:
    path: plugins/flutter_mining

  # === N42 Chat Module ===
  n42_chat:
    git:
      url: https://github.com/n42blockchain/n42_chat
      ref: c9a607c1
    #path: /Users/jiangyiwei/Desktop/n42_chat

  # === Live Streaming (features/live, 复用 n42_chat 自部署 LiveKit) ===
  # livekit_client / flutter_webrtc 原为 n42_chat 间接依赖，提升为直接依赖以显式使用
  livekit_client: ^2.13.0
  # get_it 用于从 n42_chat 注册的全局 GetIt.instance 取 Matrix 仓库（接口未导出）
  get_it: ^9.2.1
  # n42_chat 的原生插件传递依赖提升为直接依赖：git 依赖的传递解析会静默丢弃它们，
  # 显式声明以保证 host 端（含 flutter test）能编译 chat 的 voip/加密/人脸模糊代码。
  # flutter_callkit_incoming 钉 3.0.0：3.1.x（2026-05 末发布）移除了 n42_chat
  # voip 代码使用的 CallKitParams.textAccept/textDecline，全新解析会漂到 3.1.x 而编译失败。
  # 2026-07-26 对 3.1.3 复验：钉死理由仍成立——textAccept/textDecline 依旧不存在，
  # 且 callkit 的 Event 枚举被重命名，call_notification_service.dart 报 19 处错误。
  # 解钉前须先改 packages/n42_chat/lib/src/services/voip/call_notification_service.dart。
  flutter_callkit_incoming: 3.0.0
  flutter_vodozemac: ^0.6.0
  google_mlkit_face_detection: ^0.14.0
  # n42_chat native OCR/translation dependencies are declared explicitly so
  # git dependency resolution cannot silently omit their platform plugins.
  google_mlkit_text_recognition: ^0.16.0
  google_mlkit_translation: ^0.14.0
  flutter_background: ^1.3.1

# Override: flutter_secure_storage 10.x needed for compatibility with
# matrix_dart_sdk which pins an older version via vodozemac dependency chain
dependency_overrides:
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  image_picker_platform_interface: ^2.11.1
  path_provider_platform_interface: ^2.1.2
  sqlcipher_flutter_libs: ^0.6.4
  sqlite3: ^2.4.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  
  # === Linting ===
  flutter_lints: ^6.0.0

  # === Code Generation ===
  build_runner: ^2.11.1
  json_serializable: ^6.9.5  # blocked by vodozemac→analyzer chain
  freezed: ">=3.2.0 <3.2.6"  # 3.2.5 bugfix allowed; still within vodozemac compat range
  intl_utils: ^2.8.13

  # === Testing ===
  mockito: ^5.6.3
  mocktail: ^1.0.3
  vodozemac: ^0.5.0
  bloc_test: ^10.0.0
  sqflite_common_ffi: ^2.3.4
  webview_flutter_platform_interface: ^2.15.1

flutter:
  # Keep native plugin resolution consistent with the validated iOS release.
  # WebRTC and ML Kit are locked in ios/Podfile.lock; do not depend on a
  # contributor's global Flutter Swift Package Manager setting.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/
    - assets/home/
    - assets/home/tabbar/
    - assets/home/setting/
    - assets/home/setting/security/
    - assets/home/about/
    - assets/img/
    - assets/browser/
    - assets/wallet/
    - assets/wallet/swap/
    - assets/login/
    - assets/mining/
    - assets/chat/
    - assets/data/
    # n42_chat reads these root paths for sticker rendering and uploads.
    # Keep the compatibility copies in sync with the resolved Git dependency.
    - assets/stickers/openmoji/
    - assets/stickers/lottie/

flutter_intl:
  enabled: true
  locales:
    - ar
    - bn
    - cs
    - de
    - en
    - es_ES
    - fr
    - hi
    - id
    - it
    - ja
    - ko
    - mr
    - pl
    - pt
    - pt_BR
    - ru
    - sw
    - ta
    - te
    - tr
    - uk
    - ur
    - vi
    - zh_TW
